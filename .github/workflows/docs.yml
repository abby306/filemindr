name: Docs

# Builds the static documentation site (site/) and validates metadata, links,
# sitemap and structured data on every relevant push/PR. Deployment to GitHub
# Pages is manual: run this workflow from the Actions tab with `deploy` checked,
# after enabling Pages (Settings → Pages → Source: GitHub Actions).

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "README.md", "*.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "README.md", "*.md", ".github/workflows/docs.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the built site to GitHub Pages"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # page lastmod dates come from git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install site dependencies
        run: pip install -r site/requirements.txt

      - name: Build
        run: python site/build.py

      - name: Validate (metadata, links, sitemap, JSON-LD, Markdown links)
        run: python site/check.py

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        with:
          path: site/_build

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
